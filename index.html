<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Researcher Portfolio</title>
<meta name="description" content="Research portfolio: memory devices, photodetectors, phase change materials, and computational simulation.">
<style>
  :root{
    --bg:#f6f8f9; --surface:#ffffff; --text:#14202b; --muted:#566475;
    --accent:#0d7a82; --accent2:#e58a14; --border:#dfe5ea; --shadow:0 6px 24px rgba(15,40,55,.07);
    --hero1:#06292f; --hero2:#0d5f68;
  }
  :root[data-theme="dark"]{
    --bg:#0a0f14; --surface:#121a22; --text:#e7edf3; --muted:#93a1b3;
    --accent:#4fd0d8; --accent2:#f4b04f; --border:#223040; --shadow:none;
    --hero1:#04161a; --hero2:#0a3b42;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:68px}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px}

  header.hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(79,208,216,.25),transparent),linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:70px 0 56px;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
  .idrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.75);box-shadow:0 6px 24px rgba(0,0,0,.35);flex-shrink:0;background:rgba(255,255,255,.1)}
  .eyebrow{letter-spacing:.18em;font-size:.78rem;text-transform:uppercase;color:#8be3e8;margin-bottom:10px}
  .hero h1{font-size:3rem;line-height:1.05;letter-spacing:-.02em}
  .role{margin-top:10px;font-size:1.1rem;opacity:.95}
  .statement{margin-top:20px;font-size:1.08rem;max-width:520px;border-left:3px solid var(--accent2);padding-left:14px;color:#e4f4f5}
  .contact-line{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.95rem}
  .contact-line a,.contact-line span{color:#fff}
  .hero-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
  .hero-cta a{padding:10px 18px;border-radius:9px;font-weight:600;font-size:.93rem}
  .hero-cta .primary{background:var(--accent2);color:#1b1200}
  .hero-cta .ghost{border:1px solid rgba(255,255,255,.55);color:#fff}
  .hero-cta a:hover{text-decoration:none;transform:translateY(-1px)}
  .scope{background:rgba(5,20,25,.55);border:1px solid rgba(139,227,232,.3);border-radius:16px;padding:14px}
  .scope canvas{width:100%;height:auto;display:block;border-radius:8px}
  .scope .cap{font-size:.78rem;color:#9fd9dd;margin-top:8px;display:flex;justify-content:space-between}

  nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  nav .wrap{display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap}
  nav a{padding:16px 13px;color:var(--muted);font-weight:500;font-size:.93rem;border-bottom:2px solid transparent}
  nav a:hover,nav a.active{color:var(--accent);border-bottom-color:var(--accent);text-decoration:none}
  nav button{margin-left:auto;background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:1rem}

  section{padding:56px 0 6px}
  h2{font-size:1.65rem;margin-bottom:22px;display:flex;align-items:center;gap:14px;letter-spacing:-.01em}
  h2 .n{font-size:.8rem;color:var(--accent2);font-weight:700;letter-spacing:.1em}
  h2::after{content:"";flex:1;height:1px;background:var(--border)}
  h3{font-size:1rem;margin:26px 0 12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
  p+p{margin-top:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card h4{font-size:1.04rem}
  .meta{color:var(--muted);font-size:.9rem;margin-top:2px}
  .quote{margin-top:8px;color:var(--muted);font-size:.95rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .stack>.card{margin-bottom:14px}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
  .badge.published{background:#dcf3e5;color:#17693a} .badge.review{background:#fdeed6;color:#8a5a0b} .badge.prep{background:#e4e8f6;color:#3b4a8a} .badge.patent{background:#d9f0f2;color:#0b5c63}
  :root[data-theme="dark"] .badge.published{background:#16372560;color:#7ee0a2}
  :root[data-theme="dark"] .badge.review{background:#4a350f66;color:#f3c374}
  :root[data-theme="dark"] .badge.prep{background:#25306066;color:#a9b8f0}
  :root[data-theme="dark"] .badge.patent{background:#0f3a3f66;color:#7fdde4}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--surface);border:1px solid var(--border);padding:5px 13px;border-radius:99px;font-size:.88rem}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
  .btn{display:inline-block;padding:9px 16px;border-radius:9px;border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:.9rem}
  .btn:hover{background:var(--accent);color:#fff;text-decoration:none}

  .timeline{position:relative;margin-left:8px;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--border))}
  .titem{position:relative;margin-bottom:20px}
  .titem::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
  .titem.now::before{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 0 5px rgba(229,138,20,.2)}
  .titem .yr{font-size:.8rem;font-weight:700;color:var(--accent2);letter-spacing:.06em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px}

  .lab{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .figure{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .figure svg,.figure img{width:100%;height:auto;display:block;border-radius:8px}
  .figure .cap{font-size:.84rem;color:var(--muted);margin-top:8px}
  .figure .cap b{color:var(--text)}
  .tog{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.82rem;margin-top:8px}
  .hint{border:2px dashed var(--border);border-radius:14px;padding:16px;color:var(--muted);font-size:.9rem;text-align:center}
  .hint code{background:var(--surface);padding:1px 6px;border-radius:5px;color:var(--accent2)}
  .atom{transition:cx 1.1s ease,cy 1.1s ease}

  .feature{background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 14%,var(--surface)),var(--surface));border:1px solid var(--accent2);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:14px}
  .feature .tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--accent2)}
  .feature h4{font-size:1.25rem;margin:6px 0 4px;line-height:1.3}
  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
  .rv.in{opacity:1;transform:none}

  footer{margin-top:64px;padding:30px 0;border-top:1px solid var(--border);color:var(--muted);font-size:.9rem;text-align:center}
  .top{position:fixed;right:18px;bottom:18px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
  .top.show{opacity:1;pointer-events:auto}

  @media(max-width:820px){.hero .wrap,.two,.lab{grid-template-columns:1fr}.hero h1{font-size:2.3rem}.avatar{width:104px;height:104px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <div class="idrow">
        <img id="h-photo" class="avatar" alt="" hidden>
        <div>
          <div class="eyebrow" id="h-eyebrow"></div>
          <h1 id="h-name"></h1>
        </div>
      </div>
      <div class="role" id="h-role"></div>
      <p class="statement" id="h-statement"></p>
      <div class="contact-line" id="h-contact"></div>
      <div class="hero-cta" id="h-cta"></div>
    </div>
    <div class="scope" aria-hidden="true">
      <canvas id="iv" width="520" height="380"></canvas>
      <div class="cap"><span>Pinched I-V hysteresis loop</span><span>live · illustrative</span></div>
    </div>
  </div>
</header>

<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="app"></main>

<footer><div class="wrap" id="foot"></div></footer>
<button class="top" id="top" aria-label="Back to top">↑</button>

<script src="content.js"></script>
<script>
(function(){
  const S = SITE;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const has = a => Array.isArray(a) && a.length > 0;
  const hint = t => S.showEmptyHints ? `<div class="hint">${t}</div>` : '';
  const $ = id => document.getElementById(id);

  /* ---------- hero ---------- */
  document.title = S.pageTitle || S.name;
  $('h-eyebrow').textContent = S.eyebrow || '';
  $('h-name').textContent = S.name;
  if (S.photo) {
    const ph = $('h-photo');
    ph.onerror = () => { ph.hidden = true; };
    ph.alt = S.name;
    ph.style.objectPosition = S.photoPosition || 'center';
    ph.src = S.photo;
    ph.hidden = false;
  }
  $('h-role').textContent = [S.position, S.affiliation].filter(Boolean).join(' · ');
  $('h-statement').textContent = S.statement || '';
  if (!S.statement) $('h-statement').remove();
  const contact = [];
  if (S.email) contact.push(`<a href="mailto:${esc(S.email)}">📧 ${esc(S.email)}</a>`);
  if (S.location) contact.push(`<span>🌍 ${esc(S.location)}</span>`);
  $('h-contact').innerHTML = contact.join('');
  $('h-cta').innerHTML = `<a class="primary" href="#research">Explore my research</a>` +
    (S.cvLink ? `<a class="ghost" href="${esc(S.cvLink)}" target="_blank" rel="noopener">Download CV</a>` : '');

  const linkBtns = () => (S.links || []).filter(l => l.url)
    .map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');

  /* ---------- sections ---------- */
  const sections = [];
  const add = (id, label, body) => sections.push({id, label, body});

  // Highlights
  if (has(S.highlights))
    add('highlights', 'Highlight', S.highlights.map(h => `<div class="feature"><div class="tag">${esc(h.tag || '★ HIGHLIGHT')}</div><h4>${esc(h.title)}</h4><p class="quote">${esc(h.text || '')}</p>${has(h.facts) ? `<div class="chips" style="margin-top:12px">${h.facts.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>` : ''}</div>`).join(''));

  // About
  if (has(S.about) || linkBtns())
    add('about', 'About', (S.about || []).map(p => `<p>${esc(p)}</p>`).join('') +
      (linkBtns() ? `<div class="btns">${linkBtns()}</div>` : ''));

  // Journey
  const tl = list => has(list)
    ? `<div class="timeline">${list.map(e => `<div class="titem${e.now ? ' now' : ''}"><div class="yr">${esc(e.years || '')}</div><strong>${esc(e.title || '')}</strong><div class="meta">${esc(e.place || '')}</div>${e.text ? `<div class="quote" style="margin-top:4px">${esc(e.text)}</div>` : ''}</div>`).join('')}</div>`
    : '';
  if (has(S.experience) || has(S.education) || S.showEmptyHints)
    add('journey', 'Journey', `<div class="two">
      <div><h3>Experience</h3>${tl(S.experience) || hint('Add your roles to <code>experience</code> in content.js')}</div>
      <div><h3>Education</h3>${tl(S.education) || hint('Add your degrees to <code>education</code> in content.js')}</div></div>`);

  // Research
  if (has(S.interests) || has(S.projects))
    add('research', 'Research',
      (has(S.interests) ? `<h3>Interests</h3><div class="chips">${S.interests.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>` : '') +
      (has(S.projects) ? `<h3>Projects</h3><div class="grid">${S.projects.map(p => `<div class="card"><h4>${esc(p.title)}</h4><div class="meta">${esc(p.type || '')}</div><p class="quote">${esc(p.text || '')}</p></div>`).join('')}</div>` : ''));

  // Gallery
  const schem = S.showSchematics ? `
    <div class="figure">
      <svg viewBox="0 0 320 210" role="img" aria-label="Crystalline versus amorphous lattice schematic">
        <rect width="320" height="210" rx="10" fill="var(--bg)"/><g id="atoms"></g></svg>
      <div class="cap"><b>Phase change, schematic.</b> Ordered lattice (low resistance) vs disordered (high resistance).</div>
      <button class="tog" id="phase">Switch phase</button>
    </div>
    <div class="figure">
      <svg viewBox="0 0 320 210" role="img" aria-label="Photodetector current versus time under light pulses, schematic">
        <rect width="320" height="210" rx="10" fill="var(--bg)"/>
        <g stroke="var(--border)" stroke-width="1"><line x1="30" y1="180" x2="305" y2="180"/><line x1="30" y1="20" x2="30" y2="180"/></g>
        <g fill="var(--accent2)" opacity=".13"><rect x="70" y="20" width="60" height="160"/><rect x="190" y="20" width="60" height="160"/></g>
        <path id="pd" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
        <text x="305" y="198" font-size="10" fill="var(--muted)" text-anchor="end">time →</text>
        <text x="10" y="22" font-size="10" fill="var(--muted)">I</text></svg>
      <div class="cap"><b>Photoresponse, schematic.</b> Current rises and decays as light pulses switch on and off.</div>
    </div>` : '';
  const imgs = (S.gallery || []).map(g => `<div class="figure"><img src="${esc(g.src)}" alt="${esc(g.title || '')}" loading="lazy"><div class="cap"><b>${esc(g.title || '')}</b> ${esc(g.caption || '')}</div></div>`).join('');
  const galleryHint = (!has(S.gallery)) ? hint('Add your plots and photos to <code>gallery</code> in content.js') : '';
  if (schem || imgs || galleryHint)
    add('gallery', 'Gallery', `<div class="lab">${schem}${imgs}</div>${galleryHint ? `<div style="margin-top:16px">${galleryHint}</div>` : ''}`);

  // Publications
  const labels = {published:'PUBLISHED', review:'UNDER REVIEW', prep:'IN PREPARATION', patent:'PATENT GRANTED'};
  const isUrl = s => /^https?:/i.test(s || '');
  const pubLine = p => {
    if (p.doi && !isUrl(p.doi))
      return `<div class="meta">DOI: <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.doi)}</a></div>`;
    const u = isUrl(p.doi) ? p.doi : p.link;
    return isUrl(u) ? `<div class="meta"><a href="${esc(u)}" target="_blank" rel="noopener">Read the paper →</a></div>` : '';
  };
  if (has(S.publications) || S.showEmptyHints)
    add('publications', 'Publications &amp; Patents', has(S.publications)
      ? `<div class="stack">${S.publications.map(p => `<div class="card"><h4>${esc(p.title)}<span class="badge ${esc(p.status || 'prep')}">${labels[p.status] || 'IN PREPARATION'}</span></h4><div class="meta">${esc(p.authors || '')}${p.venue ? ' · ' + esc(p.venue) : ''}</div>${pubLine(p)}</div>`).join('')}</div>`
      : hint('Add papers to <code>publications</code> in content.js'));

  // Skills
  const groups = (S.skills || []).filter(g => has(g.items));
  const emptyGroups = (S.skills || []).filter(g => !has(g.items));
  if (groups.length || has(S.languages) || (S.showEmptyHints && emptyGroups.length))
    add('skills', 'Skills',
      `<div class="grid">${groups.map(g => `<div class="card"><h4>${esc(g.group)}</h4><div class="chips" style="margin-top:10px">${g.items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('')}</div>` +
      (S.showEmptyHints && emptyGroups.length ? `<div style="margin-top:16px">${hint('Still empty in content.js: ' + emptyGroups.map(g => '<code>' + esc(g.group) + '</code>').join(', '))}</div>` : '') +
      (has(S.languages) ? `<h3>Languages</h3><div class="chips">${S.languages.map(l => `<span class="chip">${esc(l)}</span>`).join('')}</div>` : ''));

  // Achievements
  if (has(S.achievements) || S.showEmptyHints)
    add('achievements', 'Achievements', has(S.achievements)
      ? `<div class="grid">${S.achievements.map(a => `<div class="card"><h4>${esc(a.title)}</h4><div class="meta">${esc([a.year, a.note].filter(Boolean).join(' · '))}</div></div>`).join('')}</div>`
      : hint('Add awards, fellowships and workshops to <code>achievements</code> in content.js'));

  // Connect
  add('connect', 'Connect', `<p>${esc(S.connectText || '')}</p><div class="btns">${S.email ? `<a class="btn" href="mailto:${esc(S.email)}">Email me</a>` : ''}${linkBtns()}</div>` +
      (!S.email && !linkBtns() ? hint('Add your <code>email</code> and <code>links</code> in content.js') : ''));

  /* ---------- render ---------- */
  $('nav').innerHTML = sections.map(s => `<a href="#${s.id}">${s.label}</a>`).join('') + '<button id="theme" aria-label="Toggle dark mode">🌓</button>';
  $('app').innerHTML = sections.map((s, i) => `<section id="${s.id}" class="rv"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.label}</h2>${s.body}</section>`).join('');
  $('foot').innerHTML = `© ${new Date().getFullYear()} ${esc(S.name)}${S.lastUpdated ? ' · Last updated ' + esc(S.lastUpdated) : ''}`;

  /* ---------- behaviour ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch(e){}
  $('theme').onclick = () => {
    const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch(e){}
  };
  const top = $('top'); top.onclick = () => window.scrollTo({top:0});
  const links = [...document.querySelectorAll('nav a')];
  const secs = links.map(a => document.querySelector(a.getAttribute('href')));
  addEventListener('scroll', () => {
    top.classList.toggle('show', scrollY > 500);
    let i = secs.findIndex(s => s.getBoundingClientRect().top > 120);
    i = i === -1 ? secs.length - 1 : Math.max(0, i - 1);
    links.forEach((a, k) => a.classList.toggle('active', k === i));
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.08});
  document.querySelectorAll('.rv').forEach(el => io.observe(el));

  /* ---------- hero animation: pinched hysteresis loop ---------- */
  (function(){
    const c = $('iv'), g = c.getContext('2d'), W = c.width, H = c.height, trail = [];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t = 0;
    const pt = t => { const v = Math.sin(t), i = v * (1 - 0.75 * Math.cos(t)); return [W/2 + v * W*0.38, H/2 - i * H*0.24]; };
    (function frame(){
      g.clearRect(0,0,W,H);
      g.strokeStyle = 'rgba(159,217,221,.25)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.moveTo(W/2,0); g.lineTo(W/2,H); g.stroke();
      g.fillStyle = 'rgba(159,217,221,.6)'; g.font = '12px system-ui';
      g.fillText('V', W-16, H/2-8); g.fillText('I', W/2+8, 14);
      g.strokeStyle = 'rgba(139,227,232,.35)'; g.lineWidth = 2; g.beginPath();
      for (let a = 0; a <= Math.PI*2+.05; a += .03){ const [x,y] = pt(a); a ? g.lineTo(x,y) : g.moveTo(x,y); }
      g.stroke();
      if (!reduce) t += .035;
      const p = pt(t); trail.push(p); if (trail.length > 70) trail.shift();
      g.lineWidth = 3;
      for (let k = 1; k < trail.length; k++){
        g.strokeStyle = 'rgba(244,176,79,' + (k/trail.length).toFixed(2) + ')';
        g.beginPath(); g.moveTo(trail[k-1][0], trail[k-1][1]); g.lineTo(trail[k][0], trail[k][1]); g.stroke();
      }
      g.fillStyle = '#f4b04f'; g.beginPath(); g.arc(p[0], p[1], 6, 0, 7); g.fill();
      requestAnimationFrame(frame);
    })();
  })();

  /* ---------- gallery schematics ---------- */
  if ($('atoms')) {
    const ns = 'http://www.w3.org/2000/svg', box = $('atoms'), atoms = [];
    const cols = 8, rows = 5, dx = 36, dy = 36, ox = 38, oy = 34;
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280 - .5;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
      const el = document.createElementNS(ns, 'circle');
      el.setAttribute('r', 8); el.setAttribute('class', 'atom');
      el.setAttribute('fill', (r + c) % 2 ? 'var(--accent2)' : 'var(--accent)');
      const bx = ox + c*dx, by = oy + r*dy;
      atoms.push({el, bx, by, jx: rnd()*22, jy: rnd()*22});
      el.setAttribute('cx', bx); el.setAttribute('cy', by); box.appendChild(el);
    }
    let amorphous = false;
    $('phase').onclick = () => {
      amorphous = !amorphous;
      atoms.forEach(a => { a.el.setAttribute('cx', a.bx + (amorphous ? a.jx : 0)); a.el.setAttribute('cy', a.by + (amorphous ? a.jy : 0)); });
    };
    const p = $('pd'); let d = '', I = 0;
    for (let x = 30; x <= 305; x += 2){
      const on = (x >= 70 && x < 130) || (x >= 190 && x < 250);
      I += ((on ? 1 : 0) - I) * (on ? .12 : .07);
      d += (x === 30 ? 'M' : 'L') + x + ' ' + (170 - I * 120).toFixed(1);
    }
    p.setAttribute('d', d);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.style.animation = 'draw 4s ease-in-out infinite alternate';
    const st = document.createElement('style'); st.textContent = '@keyframes draw{to{stroke-dashoffset:0}}'; document.head.appendChild(st);
  }
})();
</script>
